name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y formato (Biome)
        run: npx biome ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Build de producción
        run: npm run build
